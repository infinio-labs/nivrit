[package]
name = "nivrit-crypto"
description = "Post-quantum hybrid cryptography for Nivrit: X25519 + ML-KEM-768 key exchange, AES-256-GCM, and ML-DSA-65 signatures"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Published to crates.io alongside this crate, so it needs a version: a path
# alone does not survive packaging.
nivrit-core = { path = "../nivrit-core", version = "=2.1.0" }

aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
argon2 = { workspace = true }
rand = { workspace = true }
x25519-dalek = { workspace = true }
base64 = { workspace = true }
ml-kem = { version = "=0.3.2", default-features = false, features = [
    "alloc",
    "getrandom",
] }
hkdf = "=0.13.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Post-quantum signatures (Phase 4).
ml-dsa = { version = "=0.1.1", optional = true }

# Cloud KMS KEK backends (optional).
aws-config = { version = "=1.10.1", optional = true }
aws-sdk-kms = { version = "=1.114.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
], optional = true }
azure_identity = { version = "=1.0.0", optional = true }
azure_core = { version = "=1.1.0", optional = true }
azure_security_keyvault_keys = { version = "=1.0.0", optional = true }

[features]
default = ["pq-signatures"]
pq-signatures = ["dep:ml-dsa"]
kek-aws = ["dep:aws-config", "dep:aws-sdk-kms"]
kek-azure = ["dep:azure_identity", "dep:azure_core", "dep:azure_security_keyvault_keys"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
