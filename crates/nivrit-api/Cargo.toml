[package]
name = "nivrit-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nivrit-api"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.19.0"

[dependencies]
nivrit-core = { path = "../nivrit-core" }
nivrit-crypto = { path = "../nivrit-crypto" }
nivrit-db = { path = "../nivrit-db" }
nivrit-auth = { path = "../nivrit-auth" }

axum = { workspace = true }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tokio = { workspace = true }
tokio-rustls = { version = "0.26.2", default-features = false }
tower = { workspace = true }
tower-http = { workspace = true }
rustls = { version = "0.23.26", default-features = false, features = ["std", "aws_lc_rs", "prefer-post-quantum"] }
serde = { workspace = true }
serde_json = { workspace = true }
figment = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["json", "form", "rustls"] }
rand = { workspace = true }
sha2 = { workspace = true }
jsonwebtoken = { workspace = true }
urlencoding = "2.1.3"
axum-prometheus = "0.8.0"
