[package]
name = "nivrit-crypto-helper"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Server- and tooling-side crate: distributed as a binary or a container,
# never as a library on crates.io. Saying so here means `cargo publish` in
# the release workflow cannot push it there by accident.
publish = false

[[bin]]
name = "nivrit-crypto-helper"
path = "src/main.rs"

[dependencies]
nivrit-crypto = { path = "../nivrit-crypto" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
