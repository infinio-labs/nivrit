[package]
name = "nivrit-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nivrit-core = { path = "../nivrit-core" }
nivrit-crypto = { path = "../nivrit-crypto" }
nivrit-db = { path = "../nivrit-db" }

argon2 = { workspace = true }
jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }

# TOTP / 2FA
totp-rs = { version = "=5.7.1", features = ["otpauth", "gen_secret"] }

# Email
lettre = { version = "=0.11.22", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool"] }

# TOTP secret encryption
aes-gcm = { workspace = true }
base64 = { workspace = true }
