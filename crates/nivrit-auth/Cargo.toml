[package]
name = "nivrit-auth"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Server- and tooling-side crate: distributed as a binary or a container,
# never as a library on crates.io. Saying so here means `cargo publish` in
# the release workflow cannot push it there by accident.
publish = false

[dependencies]
nivrit-core = { path = "../nivrit-core" }
nivrit-crypto = { path = "../nivrit-crypto" }
nivrit-db = { path = "../nivrit-db" }

jsonwebtoken = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
axum = { workspace = true }

# TOTP / 2FA
totp-rs = { version = "=6.0.0", features = ["otpauth", "gen_secret"] }

# Email
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool"] }

# TOTP secret encryption
aes-gcm = { workspace = true }
base64 = { workspace = true }

# Credential hashing (see src/credential.rs for why this is a MAC, not Argon2)
hmac = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
