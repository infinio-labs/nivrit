[package]
name = "nivrit-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Server- and tooling-side crate: distributed as a binary or a container,
# never as a library on crates.io. Saying so here means `cargo publish` in
# the release workflow cannot push it there by accident.
publish = false

[[bin]]
name = "niv"
path = "src/main.rs"

[dependencies]
nivrit-core = { path = "../nivrit-core" }

nivrit-crypto = { path = "../nivrit-crypto" }

clap = { workspace = true }
reqwest = { workspace = true }
regex = { workspace = true }
rpassword = { workspace = true }
urlencoding = "=2.1.3"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "=3.27.0"
