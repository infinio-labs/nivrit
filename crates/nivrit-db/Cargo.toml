[package]
name = "nivrit-db"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
# Server- and tooling-side crate: distributed as a binary or a container,
# never as a library on crates.io. Saying so here means `cargo publish` in
# the release workflow cannot push it there by accident.
publish = false

[dependencies]
nivrit-core = { path = "../nivrit-core" }

sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
