<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nivrit</title>
    <meta
      name="description"
      content="Nivrit is an end-to-end encrypted secret manager with post-quantum key exchange. Secrets are encrypted in your browser; the server only ever stores ciphertext."
    />
    <!-- Every page is behind authentication and holds decrypted key material,
         so there is nothing here worth indexing or previewing. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <!-- Inline SVG shield, matching the in-app logo. Avoids a second request and
         keeps the icon in the same reviewable file as the rest of the shell. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'/%3E%3Cpath d='m9 12 2 2 4-4'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 34rem; margin: 4rem auto; padding: 0 1rem">
        <h1 style="font-size: 1.25rem">JavaScript is required</h1>
        <p>
          Nivrit encrypts and decrypts your secrets inside this page, using a WebAssembly crypto
          module. That work cannot be moved to the server without giving the server your keys, so
          the app cannot run with JavaScript disabled.
        </p>
        <p>
          If you would rather not run application code from a web page, use the command-line
          client instead — it is the higher-assurance way to use Nivrit.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
