# Production-oriented sample compose.
# 1. Copy .env.example to .env and fill in real secrets.
# 2. For released images, set NIVRIT_VERSION to the image version (for example,
#    2.1.0). For a source deployment, omit it and run with --build.
# 3. Run: docker compose -f deploy/docker-compose.yml --env-file .env up -d
#    or: docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# For a public hostname, set NIVRIT_DEPLOY_CORS_ORIGIN to that exact https URL.
# Generate and set NIVRIT_SIGNING_KEY_SEED in .env (openssl rand -base64 32).

services:
  postgres:
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nivrit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-nivrit}
    volumes:
      - nivrit-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nivrit} -d ${POSTGRES_DB:-nivrit}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: "ghcr.io/infinio-labs/nivrit-api:${NIVRIT_VERSION:-local}"
    build:
      context: ..
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      # The documented command loads the repository-root .env.
      - ${NIVRIT_ENV_FILE:-../.env}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-nivrit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nivrit}
      # The root development default is loopback-only; containers need the
      # service interface so Caddy can reach the API over Docker networking.
      NIVRIT_HOST: 0.0.0.0
      # Caddy fronts the API; without this every client shares the proxy IP in
      # the rate limiter and audit log.
      NIVRIT_TRUSTED_PROXY: "true"
      NIVRIT_CORS_ORIGIN: ${NIVRIT_DEPLOY_CORS_ORIGIN:-http://localhost:8080}
      # Production defaults to signed audit logs. Set the opt-out explicitly
      # only for a disposable evaluation deployment.
      NIVRIT_AUDIT_SIGNING_DISABLED: ${NIVRIT_DEPLOY_AUDIT_SIGNING_DISABLED:-false}
    ports:
      # Keep the API off the public interface; expose it through the web
      # proxy or an explicitly configured private network.
      - "127.0.0.1:${NIVRIT_API_HOST_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No curl in the runtime image (distroless) -- the binary checks itself.
      test: ["CMD", "/usr/local/bin/nivrit-api", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: "ghcr.io/infinio-labs/nivrit-web:${NIVRIT_VERSION:-local}"
    build:
      context: ..
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      # Put TLS termination in front of this loopback-only listener for
      # internet use (Caddy's container listener is HTTP on the host side).
      - "127.0.0.1:${NIVRIT_WEB_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  nivrit-postgres-data:
