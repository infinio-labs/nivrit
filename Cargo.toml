[workspace]
members = [
    "crates/nivrit-core",
    "crates/nivrit-crypto",
    "crates/nivrit-db",
    "crates/nivrit-auth",
    "crates/nivrit-api",
    "crates/nivrit-cli",
    "crates/nivrit-web-crypto",
    "crates/nivrit-crypto-helper",
    "sdks/rust",
]
resolver = "2"

[workspace.package]
version = "2.1.0"
edition = "2021"
authors = ["Nivrit Contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/infinio-labs/nivrit"
rust-version = "1.98.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "=1.53.1", features = ["full"] }

# Web framework
axum = "=0.8.9"
tower = "=0.5.3"
tower-http = { version = "=0.7.0", features = ["cors", "trace", "timeout", "request-id"] }

# Serialization
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.23.1"

# Database
sqlx = { version = "=0.9.0", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
] }

# IDs and time
uuid = { version = "=1.26.0", features = ["v4", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }

# Errors
anyhow = "=1.0.104"
thiserror = "=2.0.18"

# Logging
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }

# CLI
clap = { version = "=4.6.6", features = ["derive"] }
reqwest = { version = "=0.13.4", features = ["json"] }
regex = "=1.13.1"
rpassword = "=7.5.4"

# Auth
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["aws_lc_rs"] }
argon2 = "=0.5.3"

# Crypto
aes-gcm = "=0.11.0"
chacha20poly1305 = "=0.11.0"
sha2 = "=0.11.0"
hmac = "=0.13.0"
hkdf = "=0.13.0"
subtle = "=2.6.1"
pbkdf2 = "=0.13.0"
rand = "=0.10.2"
zeroize = { version = "=1.9.0", features = ["derive"] }
x25519-dalek = { version = "=3.0.0", features = ["getrandom", "static_secrets"] }

# Config
figment = { version = "=0.10.19", features = ["env", "toml"] }
dotenvy = "=0.15.7"

[profile.release]
opt-level = 3
lto = true
# Smallest possible binaries: one codegen unit lets LTO inline across the whole
# crate graph, and no symbol table. Costs compile time, not runtime.
# Deliberately NOT panic = "abort": a panic in one Axum handler must fail that
# request, not kill the server for every other tenant.
codegen-units = 1
strip = "symbols"