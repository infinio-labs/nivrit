name: SDKs

on:
  push:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'crates/nivrit-crypto-helper/**'
      - '.github/workflows/sdks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sdks/**'
      - 'crates/nivrit-crypto-helper/**'
      - '.github/workflows/sdks.yml'

env:
  CARGO_TERM_COLOR: always
  NIVRIT_API_URL: http://localhost:4000
  HEX_VERSION: 2.5.1
  REBAR3_URL: https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3
  REBAR3_SHA512: 0d00494d849fdc521a55142278d1f6ba552954fbd65b80d40df8022f594f05d6c99ed1d731bc263691a04176e11d4c6e126c56ba20dca19c5e42d4ffab2e7e36

jobs:
  build-helper:
    name: Build crypto helper (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            asset: nivrit-crypto-helper-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            asset: nivrit-crypto-helper-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-15
            asset: nivrit-crypto-helper-darwin-x86_64
          - target: aarch64-apple-darwin
            os: macos-15
            asset: nivrit-crypto-helper-darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            asset: nivrit-crypto-helper-windows-x86_64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: nivrit-crypto-helper-${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu=4:13.2.0-7ubuntu1

      - name: Build helper
        run: cargo build --locked --release -p nivrit-crypto-helper --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/nivrit-crypto-helper*
          if-no-files-found: error

  smoke-tests:
    name: Smoke tests (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    needs: build-helper
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, go, rust]
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: nivrit
          POSTGRES_PASSWORD: nivrit
          POSTGRES_DB: nivrit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: nivrit-api

      - name: Download helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nivrit-crypto-helper-linux-x86_64
          path: target/release

      - name: Make helper executable
        run: chmod +x target/release/nivrit-crypto-helper

      - name: Start API
        run: |
          export DATABASE_URL=postgres://nivrit:nivrit@localhost:5432/nivrit
          cd crates/nivrit-api
          cargo run --locked --release > "$RUNNER_TEMP/nivrit-api.log" 2>&1 &
          api_pid=$!
          for _ in {1..600}; do
            if curl -fsS http://localhost:4000/health >/dev/null 2>&1; then
              exit 0
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/nivrit-api.log"
              exit 1
            fi
            sleep 1
          done
          echo "API did not become healthy within 10 minutes"
          cat "$RUNNER_TEMP/nivrit-api.log"
          exit 1

      - name: Setup Node
        if: matrix.sdk == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'

      - name: Setup Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Setup Go
        if: matrix.sdk == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'

      - name: Run Node smoke test
        if: matrix.sdk == 'node'
        run: |
          cd sdks/node
          node test/smoke.js

      - name: Run Python smoke test
        if: matrix.sdk == 'python'
        run: |
          cd sdks/python
          PYTHONPATH=. python3 tests/test_smoke.py

      - name: Run Go smoke test
        if: matrix.sdk == 'go'
        run: |
          cd sdks/go/nivrit
          go test -mod=readonly -v -run TestSmoke ./...

      - name: Run Rust smoke test
        if: matrix.sdk == 'rust'
        run: cargo test --locked -p nivrit-sdk --test smoke -- --nocapture

  # Hermetic crypto round-trips for the SDKs the smoke matrix doesn't cover.
  # No API/DB: each test drives its wrapper against the helper binary directly,
  # which is exactly the surface where wrapper bugs hide (e.g. the Elixir stdin
  # bug). Faster than the e2e smoke job and isolates the crypto contract.
  crypto-parity:
    name: SDK crypto parity (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    needs: build-helper
    strategy:
      fail-fast: false
      matrix:
        sdk: [ruby, dotnet, java, elixir]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download helper
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nivrit-crypto-helper-linux-x86_64
          path: target/release

      - name: Make helper executable and export path
        run: |
          chmod +x target/release/nivrit-crypto-helper
          echo "NIVRIT_CRYPTO_HELPER=$GITHUB_WORKSPACE/target/release/nivrit-crypto-helper" >> "$GITHUB_ENV"

      - name: Setup .NET
        if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.302'

      - name: Setup Java
        if: matrix.sdk == 'java'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: oracle
          java-version: '25.0.4'

      - name: Setup Elixir
        if: matrix.sdk == 'elixir'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.2'

      - name: Ruby crypto test
        if: matrix.sdk == 'ruby'
        working-directory: sdks/ruby
        run: ruby -Ilib test/crypto_test.rb

      - name: .NET crypto test
        if: matrix.sdk == 'dotnet'
        working-directory: sdks/dotnet/Nivrit.Tests
        run: dotnet test

      - name: Java crypto test
        if: matrix.sdk == 'java'
        working-directory: sdks/java
        run: ./mvnw -q -B test

      - name: Elixir crypto test
        if: matrix.sdk == 'elixir'
        working-directory: sdks/elixir
        run: |
          mix local.hex "$HEX_VERSION" --force
          mix local.rebar rebar3 "$REBAR3_URL" --sha512 "$REBAR3_SHA512" --force
          mix deps.get --check-locked
          mix test test/crypto_test.exs

  # Regression for PACKAGED resolution: builds each SDK's distributable with the
  # helper bundled, then runs a crypto round-trip with NIVRIT_CRYPTO_HELPER UNSET
  # and no cargo build present — so only the embedded/bundled binary can satisfy
  # it. This is the path real registry installs take; the jobs above all inject
  # the helper via env/dev path and never exercise it.
  packaged-install:
    name: Packaged install (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    needs: build-helper
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, go, ruby, java, dotnet, elixir]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all helper binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Flatten helper binaries into helpers/
        run: |
          mkdir -p helpers
          for d in artifacts/nivrit-crypto-helper-*; do
            name=$(basename "$d")
            cp "$(find "$d" -type f | head -1)" "helpers/$name"
          done
          ls -la helpers

      - name: Setup Bun
        if: matrix.sdk == 'node'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        if: matrix.sdk == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'

      - name: Setup Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Setup Go
        if: matrix.sdk == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.5'

      - name: Setup Ruby
        if: matrix.sdk == 'ruby'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.6'

      - name: Setup Java
        if: matrix.sdk == 'java'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: oracle
          java-version: '25.0.4'

      - name: Setup .NET
        if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.302'

      - name: Setup Elixir
        if: matrix.sdk == 'elixir'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.2'

      - name: Node packaged install
        if: matrix.sdk == 'node'
        working-directory: sdks/node
        run: |
          cp -r ../../helpers .
          bash scripts/build-platform-packages.sh
          sdk_tgz="$PWD/$(bun pm pack --quiet)"
          helper_tgz="$PWD/npm/helper-linux-x64/$(cd npm/helper-linux-x64 && bun pm pack --quiet)"
          proj=$(mktemp -d)
          cp test/packaged.js "$proj/packaged.js"
          cd "$proj"
          bun init --yes
          bun add --silent "$sdk_tgz" "$helper_tgz"
          env -u NIVRIT_CRYPTO_HELPER node packaged.js

      - name: Python packaged install
        if: matrix.sdk == 'python'
        working-directory: sdks/python
        run: |
          cp -r ../../helpers .
          python -m pip install pip==26.1.2 build==1.5.0 wheel==0.47.0 setuptools==83.0.0
          PYTHON=python bash build-wheels.sh
          python -m pip install dist/nivrit_sdk-0.1.0-py3-none-manylinux2014_x86_64.whl
          cd /tmp
          env -u NIVRIT_CRYPTO_HELPER python "$GITHUB_WORKSPACE/sdks/python/tests/test_packaged.py"

      - name: Go embedded build
        if: matrix.sdk == 'go'
        working-directory: sdks/go/nivrit
        run: |
          cp -r ../../../helpers .
          bash scripts/embed-helpers.sh
          env -u NIVRIT_CRYPTO_HELPER go test -mod=readonly -v -run TestBundledHelper ./...

      - name: Ruby fat gem
        if: matrix.sdk == 'ruby'
        working-directory: sdks/ruby
        run: |
          cp -r ../../helpers .
          bash build-gems.sh
          # bundled-resolution test: binary in vendor/, env unset, no dev build
          mkdir -p vendor
          cp helpers/nivrit-crypto-helper-linux-x86_64 vendor/nivrit-crypto-helper
          chmod +x vendor/nivrit-crypto-helper
          env -u NIVRIT_CRYPTO_HELPER ruby -Ilib test/crypto_test.rb

      - name: Java JAR resources
        if: matrix.sdk == 'java'
        working-directory: sdks/java
        run: |
          cp -r ../../helpers .
          bash build-resources.sh
          env -u NIVRIT_CRYPTO_HELPER ./mvnw -q -B test

      - name: .NET embedded resources
        if: matrix.sdk == 'dotnet'
        working-directory: sdks/dotnet/Nivrit
        run: |
          cp -r ../../../helpers .
          bash build-resources.sh
          cd ../Nivrit.Tests
          env -u NIVRIT_CRYPTO_HELPER dotnet test

      - name: Elixir priv bundle
        if: matrix.sdk == 'elixir'
        working-directory: sdks/elixir
        run: |
          cp -r ../../helpers .
          bash build-priv.sh
          mix local.hex "$HEX_VERSION" --force
          mix local.rebar rebar3 "$REBAR3_URL" --sha512 "$REBAR3_SHA512" --force
          mix deps.get --check-locked
          env -u NIVRIT_CRYPTO_HELPER mix test test/crypto_test.exs
