name: Semantic Release

# Cut a release when CI goes green on main. semantic-release analyzes
# conventional commits since the last tag, bumps every version manifest,
# commits the bump, and pushes the vX.Y.Z tag — which is what triggers
# .github/workflows/release.yml (binaries, GitHub Release, SDK publishes,
# GHCR image push).
#
# Triggering off workflow_run (rather than `push: main`) means a release is
# only ever cut from a commit CI actually passed — no tagging broken code.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write # push the release commit + tag

# Serialize releases: two CI runs finishing close together must not race to
# push the same tag. A queued second run sees the first's tag and no-ops.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release exactly the commit CI tested, not whatever main points at
          # by the time this queued run starts.
          ref: ${{ github.event.workflow_run.head_sha }}
          # semantic-release needs the full history + tags to compute the next
          # version. No credentials in .git/config: the git plugin pushes via
          # GITHUB_TOKEN from the env below.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
          cache: npm
      - name: Install release tooling
        run: npm ci
      - name: Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
