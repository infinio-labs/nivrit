name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: nivrit
          POSTGRES_PASSWORD: nivrit
          POSTGRES_DB: nivrit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nivrit -d nivrit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # sqlx verifies query macros against this live database at compile time.
      DATABASE_URL: postgres://nivrit:nivrit@localhost:5432/nivrit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # install-action doesn't know sqlx-cli@0.9.0 and its cargo-binstall
      # fallback breaks on current runner images ("this action requires
      # bash"). cargo install from crates.io is reliable and the compiled
      # binary is reused across runs via the rust-cache target dir.
      - run: cargo install sqlx-cli --locked --version 0.9.0 --no-default-features --features postgres

      - name: Run migrations
        run: sqlx migrate run --source crates/nivrit-db/migrations

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        # wasm-bindgen crate is excluded; it targets wasm32, not the host.
        run: cargo clippy --locked --workspace --exclude nivrit-web-crypto --all-targets -- -D warnings

      - name: Tests (unit + db integration)
        # nivrit-sdk is excluded: its only test is an e2e smoke needing a live
        # API server, which the sdks.yml workflow covers.
        run: cargo test --locked --workspace --exclude nivrit-web-crypto --exclude nivrit-sdk

  frontend:
    name: web typecheck / tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install web dependencies
        working-directory: crates/nivrit-web
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: crates/nivrit-web
        run: bun run typecheck

      - name: Tests
        working-directory: crates/nivrit-web
        run: bun run test

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
