name: CI

# Private-repo jobs use the Linux x64 self-hosted runner. Making the repository
# public automatically switches them back to GitHub-hosted runners.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt / clippy / tests
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-24.04' }}
    services:
      postgres:
        image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: nivrit
          POSTGRES_PASSWORD: nivrit
          POSTGRES_DB: nivrit
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # sqlx verifies query macros against this live database at compile time.
      DATABASE_URL: postgres://nivrit:nivrit@localhost:55432/nivrit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: sqlx-cli@0.9.0

      - name: Run migrations
        run: sqlx migrate run --source crates/nivrit-db/migrations

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        # wasm-bindgen crate is excluded; it targets wasm32, not the host.
        run: cargo clippy --locked --workspace --exclude nivrit-web-crypto --all-targets -- -D warnings

      - name: Tests (unit + db integration)
        # nivrit-sdk is excluded: its only test is an e2e smoke needing a live
        # API server, which the sdks.yml workflow covers.
        run: cargo test --locked --workspace --exclude nivrit-web-crypto --exclude nivrit-sdk

  frontend:
    name: web typecheck / tests
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install web dependencies
        working-directory: crates/nivrit-web
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: crates/nivrit-web
        run: bun run typecheck

      - name: Tests
        working-directory: crates/nivrit-web
        run: bun run test

  audit:
    name: cargo audit
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
