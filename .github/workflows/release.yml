name: Release

# Tag-triggered release. The tag (e.g. v0.1.0) must match the version already
# committed in every SDK manifest and the workspace Cargo.toml — this workflow
# publishes, it does not bump. Cut a "bump versions" commit first, then tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR
  id-token: write   # PyPI trusted publishing / OIDC

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- Build the crypto-helper for every platform (SDKs bundle these) --------
  build-helper:
    name: Helper (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest,  asset: nivrit-crypto-helper-linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest,  asset: nivrit-crypto-helper-linux-aarch64 }
          - { target: x86_64-apple-darwin,       os: macos-latest,   asset: nivrit-crypto-helper-darwin-x86_64 }
          - { target: aarch64-apple-darwin,      os: macos-latest,   asset: nivrit-crypto-helper-darwin-arm64 }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest, asset: nivrit-crypto-helper-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: helper-${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build helper
        run: cargo build --release -p nivrit-crypto-helper --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/nivrit-crypto-helper*
          if-no-files-found: error

  # ---- Build the niv CLI for every platform (attached to the Release) --------
  build-cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest,  asset: niv-linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest,  asset: niv-linux-aarch64 }
          - { target: x86_64-apple-darwin,       os: macos-latest,   asset: niv-darwin-x86_64 }
          - { target: aarch64-apple-darwin,      os: macos-latest,   asset: niv-darwin-arm64 }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest, asset: niv-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build CLI
        run: cargo build --release -p nivrit-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Rename to asset name
        shell: bash
        run: |
          mkdir -p out
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/niv.exe" "out/${{ matrix.asset }}"
          else
            cp "target/${{ matrix.target }}/release/niv" "out/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  # ---- GitHub Release with helper + CLI binaries attached --------------------
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-helper, build-cli]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir -p release
          # each artifact is a dir; copy the single file inside, keep the artifact name
          for d in artifacts/niv-* artifacts/nivrit-crypto-helper-*; do
            cp "$(find "$d" -type f | head -1)" "release/$(basename "$d")"
          done
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  # ---- Publish the registry SDKs (helper bundled per ecosystem) --------------
  publish-sdks:
    name: Publish ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    needs: build-helper
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, ruby, java, dotnet, elixir]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten helper binaries
        run: |
          mkdir -p helpers
          for d in artifacts/nivrit-crypto-helper-*; do
            cp "$(find "$d" -type f | head -1)" "helpers/$(basename "$d")"
          done

      # Node -> npm registry: publish the 5 platform helper packages, then the SDK
      - name: Setup pnpm
        if: matrix.sdk == 'node'
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - name: Setup Node
        if: matrix.sdk == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish Node
        if: matrix.sdk == 'node'
        working-directory: sdks/node
        run: |
          cp -r ../../helpers .
          bash scripts/build-platform-packages.sh
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          for d in npm/helper-*; do (cd "$d" && pnpm publish --access public); done
          pnpm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Python -> PyPI: 5 platform wheels via trusted publishing (OIDC)
      - name: Setup Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Python wheels
        if: matrix.sdk == 'python'
        working-directory: sdks/python
        run: |
          cp -r ../../helpers .
          python -m pip install -U pip build wheel setuptools
          PYTHON=python bash build-wheels.sh
      - name: Publish Python
        if: matrix.sdk == 'python'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist

      # Ruby -> RubyGems: 5 fat platform gems
      - name: Setup Ruby
        if: matrix.sdk == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Publish Ruby
        if: matrix.sdk == 'ruby'
        working-directory: sdks/ruby
        run: |
          cp -r ../../helpers .
          bash build-gems.sh
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "$GEM_HOST_API_KEY" > ~/.gem/credentials
          chmod 600 ~/.gem/credentials
          for g in pkg/*.gem; do gem push "$g"; done
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}

      # Java -> Maven Central: single JAR, all platforms bundled as resources
      - name: Setup Java
        if: matrix.sdk == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish Java
        if: matrix.sdk == 'java'
        working-directory: sdks/java
        run: |
          cp -r ../../helpers .
          bash build-resources.sh
          mvn -q -B -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # .NET -> NuGet: single package, all platforms embedded as resources
      - name: Setup .NET
        if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'
      - name: Publish .NET
        if: matrix.sdk == 'dotnet'
        working-directory: sdks/dotnet/Nivrit
        run: |
          cp -r ../../../helpers .
          bash build-resources.sh
          dotnet pack -c Release -o out
          dotnet nuget push out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      # Elixir -> Hex: binaries shipped in priv/
      - name: Setup Elixir
        if: matrix.sdk == 'elixir'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - name: Publish Elixir
        if: matrix.sdk == 'elixir'
        working-directory: sdks/elixir
        run: |
          cp -r ../../helpers .
          bash build-priv.sh
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  # ---- Rust SDK -> crates.io (publish nivrit-crypto first, then the SDK) -----
  # ponytail: assumes nivrit-crypto's own deps (e.g. nivrit-core) are already on
  # crates.io. If not, add them ahead of this in dependency order, or this fails.
  publish-rust:
    name: Publish Rust (crates.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates in dependency order
        run: |
          cargo publish -p nivrit-crypto
          cargo publish -p nivrit-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---- Container images -> GHCR ----------------------------------------------
  docker:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: nivrit-api, dockerfile: Dockerfile.api }
          - { image: nivrit-web, dockerfile: Dockerfile.web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
