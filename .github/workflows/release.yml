name: Release

# Tag-triggered release. The tag (e.g. v0.1.0) must match the version already
# committed in every SDK manifest and the workspace Cargo.toml — this workflow
# publishes, it does not bump. Cut a "bump versions" commit first, then tag.
on:
  push:
    tags:
      - 'v*'
  # Manual re-kick: require the exact existing tag so a rerun cannot publish
  # the default branch by accident.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v2.1.0)
        required: true
        type: string

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR
  id-token: write   # PyPI trusted publishing / OIDC

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  HEX_VERSION: 2.5.1
  REBAR3_URL: https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3
  REBAR3_SHA512: 0d00494d849fdc521a55142278d1f6ba552954fbd65b80d40df8022f594f05d6c99ed1d731bc263691a04176e11d4c6e126c56ba20dca19c5e42d4ffab2e7e36

jobs:
  # A tag can be dispatched manually, so the release workflow repeats the
  # release-critical CI gates instead of trusting only the tag producer.
  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        env:
          POSTGRES_USER: nivrit
          POSTGRES_PASSWORD: nivrit
          POSTGRES_DB: nivrit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nivrit -d nivrit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://nivrit:nivrit@localhost:5432/nivrit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate release tag and manifest version
        shell: python
        run: |
          import json, os, re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"invalid release tag: {tag}")
          expected = tag[1:]
          root = Path(os.environ["GITHUB_WORKSPACE"])

          checks = {
              "Cargo.toml": (r'^version = "([0-9.]+)"$', 0),
              "crates/nivrit-web/package.json": (None, None),
              "sdks/node/package.json": (None, None),
              "sdks/python/pyproject.toml": (r'^version = "([0-9.]+)"$', 0),
              "sdks/ruby/nivrit_sdk.gemspec": (r"s\.version\s*=\s*'([0-9.]+)'", 0),
              "sdks/java/pom.xml": (r'<version>([0-9.]+)</version>', 0),
              "sdks/dotnet/Nivrit/Nivrit.csproj": (r'<Version>([0-9.]+)</Version>', 0),
              "sdks/elixir/mix.exs": (r'version:\s*"([0-9.]+)"', 0),
          }
          for rel, (pattern, occurrence) in checks.items():
              path = root / rel
              if pattern is None:
                  actual = json.loads(path.read_text())["version"]
              else:
                  matches = re.findall(pattern, path.read_text(), re.MULTILINE)
                  if not matches:
                      raise SystemExit(f"no version found in {rel}")
                  actual = matches[occurrence]
              if actual != expected:
                  raise SystemExit(f"{rel}: {actual} != {expected}")
          print(f"Releasing {tag}; all published manifests are {expected}")
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit@0.22.2
      - run: cargo install sqlx-cli --locked --version 0.9.0 --no-default-features --features postgres
      - run: sqlx migrate run --source crates/nivrit-db/migrations
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --exclude nivrit-web-crypto --all-targets -- -D warnings
      - run: cargo test --locked --workspace --exclude nivrit-web-crypto --exclude nivrit-sdk
      - run: cargo audit
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - working-directory: crates/nivrit-web
        run: bun install --frozen-lockfile && bun run typecheck && bun run test

  # ---- Build the crypto-helper for every platform (SDKs bundle these) --------
  build-helper:
    name: Helper (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-24.04,  asset: nivrit-crypto-helper-linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04,  asset: nivrit-crypto-helper-linux-aarch64 }
          - { target: x86_64-apple-darwin,       os: macos-15,   asset: nivrit-crypto-helper-darwin-x86_64 }
          - { target: aarch64-apple-darwin,      os: macos-15,   asset: nivrit-crypto-helper-darwin-arm64 }
          - { target: x86_64-pc-windows-msvc,    os: windows-2025, asset: nivrit-crypto-helper-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: helper-${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu=4:13.2.0-7ubuntu1
      - name: Build helper
        run: cargo build --locked --release -p nivrit-crypto-helper --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/nivrit-crypto-helper*
          if-no-files-found: error

  # ---- Build the niv CLI for every platform (attached to the Release) --------
  build-cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-24.04,  asset: niv-linux-x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04,  asset: niv-linux-aarch64 }
          - { target: x86_64-apple-darwin,       os: macos-15,   asset: niv-darwin-x86_64 }
          - { target: aarch64-apple-darwin,      os: macos-15,   asset: niv-darwin-arm64 }
          - { target: x86_64-pc-windows-msvc,    os: windows-2025, asset: niv-windows-x86_64.exe }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cli-${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu=4:13.2.0-7ubuntu1
      - name: Build CLI
        run: cargo build --locked --release -p nivrit-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Rename to asset name
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p out
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/niv.exe" "out/$ASSET"
          else
            cp "target/$TARGET/release/niv" "out/$ASSET"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  # ---- GitHub Release with helper + CLI binaries attached --------------------
  github-release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    needs: [build-helper, build-cli, release-gate]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir -p release
          # each artifact is a dir; copy the single file inside, keep the artifact name
          for d in artifacts/niv-* artifacts/nivrit-crypto-helper-*; do
            cp "$(find "$d" -type f | head -1)" "release/$(basename "$d")"
          done
          ls -la release
      - name: Generate source SBOM
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0.23.0
        with:
          path: .
          format: cyclonedx-json
          output-file: release/SBOM.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - name: Attest release binaries
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: release/niv-*,release/nivrit-crypto-helper-*
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: release/*
          generate_release_notes: true

  # ---- Publish the registry SDKs (helper bundled per ecosystem) --------------
  # Opt-in: needs credentials for each registry (NPM_TOKEN, GEM_HOST_API_KEY,
  # MAVEN_USERNAME/PASSWORD, NUGET_API_KEY, HEX_API_KEY, CARGO_REGISTRY_TOKEN,
  # plus the PyPI trusted-publisher mapping). Set the repository variable
  # PUBLISH_SDKS=true once those exist; until then the job is skipped so a
  # release run stays green without them.
  publish-sdks:
    name: Publish ${{ matrix.sdk }}
    if: vars.PUBLISH_SDKS == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    needs: [build-helper, release-gate]
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, ruby, java, dotnet, elixir]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Flatten helper binaries
        run: |
          mkdir -p helpers
          for d in artifacts/nivrit-crypto-helper-*; do
            cp "$(find "$d" -type f | head -1)" "helpers/$(basename "$d")"
          done

      # Node -> npm registry: publish the 5 platform helper packages, then the SDK
      - name: Setup Bun
        if: matrix.sdk == 'node'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Setup Node
        if: matrix.sdk == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
      - name: Publish Node
        if: matrix.sdk == 'node'
        working-directory: sdks/node
        run: |
          cp -r ../../helpers .
          bash scripts/build-platform-packages.sh
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          for d in npm/helper-*; do (cd "$d" && bun publish --access public); done
          bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Python -> PyPI: 5 platform wheels via trusted publishing (OIDC)
      - name: Setup Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - name: Build Python wheels
        if: matrix.sdk == 'python'
        working-directory: sdks/python
        run: |
          cp -r ../../helpers .
          python -m pip install pip==26.1.2 build==1.5.0 wheel==0.47.0 setuptools==83.0.0
          PYTHON=python bash build-wheels.sh
      - name: Publish Python
        if: matrix.sdk == 'python'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdks/python/dist

      # Ruby -> RubyGems: 5 fat platform gems
      - name: Setup Ruby
        if: matrix.sdk == 'ruby'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.6'
      - name: Publish Ruby
        if: matrix.sdk == 'ruby'
        working-directory: sdks/ruby
        run: |
          cp -r ../../helpers .
          bash build-gems.sh
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "$GEM_HOST_API_KEY" > ~/.gem/credentials
          chmod 600 ~/.gem/credentials
          for g in pkg/*.gem; do gem push "$g"; done
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}

      # Java -> Maven Central: single JAR, all platforms bundled as resources
      - name: Setup Java
        if: matrix.sdk == 'java'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: oracle
          java-version: '25.0.4'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish Java
        if: matrix.sdk == 'java'
        working-directory: sdks/java
        run: |
          cp -r ../../helpers .
          bash build-resources.sh
          ./mvnw -q -B -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # .NET -> NuGet: single package, all platforms embedded as resources
      - name: Setup .NET
        if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.302'
      - name: Publish .NET
        if: matrix.sdk == 'dotnet'
        working-directory: sdks/dotnet/Nivrit
        run: |
          cp -r ../../../helpers .
          bash build-resources.sh
          dotnet restore --locked-mode
          dotnet pack -c Release --no-restore -o out
          dotnet nuget push out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      # Elixir -> Hex: binaries shipped in priv/
      - name: Setup Elixir
        if: matrix.sdk == 'elixir'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.2'
      - name: Publish Elixir
        if: matrix.sdk == 'elixir'
        working-directory: sdks/elixir
        run: |
          cp -r ../../helpers .
          bash build-priv.sh
          mix local.hex "$HEX_VERSION" --force
          mix local.rebar rebar3 "$REBAR3_URL" --sha512 "$REBAR3_SHA512" --force
          mix deps.get --check-locked
          mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  # ---- Rust SDK -> crates.io (publish nivrit-crypto first, then the SDK) -----
  # ponytail: assumes nivrit-crypto's own deps (e.g. nivrit-core) are already on
  # crates.io. If not, add them ahead of this in dependency order, or this fails.
  publish-rust:
    name: Publish Rust (crates.io)
    if: vars.PUBLISH_SDKS == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    needs: release-gate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
      - name: Publish crates in dependency order
        run: |
          cargo publish --locked -p nivrit-crypto
          cargo publish --locked -p nivrit-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---- Container images -> GHCR ----------------------------------------------
  docker:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    needs: release-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: nivrit-api, dockerfile: Dockerfile.api }
          - { image: nivrit-web, dockerfile: Dockerfile.web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
