name: Release

# Private-repo jobs use the Linux x64 self-hosted runner. Making the repository
# public restores the full GitHub-hosted platform matrix automatically.
# Tag-triggered release. The tag (e.g. v0.1.0) must match the version already
# committed in every SDK manifest and the workspace Cargo.toml — this workflow
# publishes, it does not bump. Cut a "bump versions" commit first, then tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push images to GHCR
  id-token: write   # PyPI trusted publishing / OIDC

env:
  CARGO_TERM_COLOR: always
  HEX_VERSION: 2.5.1
  REBAR3_URL: https://github.com/erlang/rebar3/releases/download/3.27.0/rebar3
  REBAR3_SHA512: 0d00494d849fdc521a55142278d1f6ba552954fbd65b80d40df8022f594f05d6c99ed1d731bc263691a04176e11d4c6e126c56ba20dca19c5e42d4ffab2e7e36

jobs:
  # ---- Build the crypto-helper for every platform (SDKs bundle these) --------
  build-helper:
    name: Helper (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event.repository.private && '[{"target":"x86_64-unknown-linux-gnu","os":"self-hosted","asset":"nivrit-crypto-helper-linux-x86_64"}]' || '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04","asset":"nivrit-crypto-helper-linux-x86_64"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-24.04","asset":"nivrit-crypto-helper-linux-aarch64"},{"target":"x86_64-apple-darwin","os":"macos-15","asset":"nivrit-crypto-helper-darwin-x86_64"},{"target":"aarch64-apple-darwin","os":"macos-15","asset":"nivrit-crypto-helper-darwin-arm64"},{"target":"x86_64-pc-windows-msvc","os":"windows-2025","asset":"nivrit-crypto-helper-windows-x86_64.exe"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: helper-${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu=4:13.2.0-7ubuntu1
      - name: Build helper
        run: cargo build --locked --release -p nivrit-crypto-helper --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: target/${{ matrix.target }}/release/nivrit-crypto-helper*
          if-no-files-found: error

  # ---- Build the niv CLI for every platform (attached to the Release) --------
  build-cli:
    name: CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event.repository.private && '[{"target":"x86_64-unknown-linux-gnu","os":"self-hosted","asset":"niv-linux-x86_64"}]' || '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-24.04","asset":"niv-linux-x86_64"},{"target":"aarch64-unknown-linux-gnu","os":"ubuntu-24.04","asset":"niv-linux-aarch64"},{"target":"x86_64-apple-darwin","os":"macos-15","asset":"niv-darwin-x86_64"},{"target":"aarch64-apple-darwin","os":"macos-15","asset":"niv-darwin-arm64"},{"target":"x86_64-pc-windows-msvc","os":"windows-2025","asset":"niv-windows-x86_64.exe"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: cli-${{ matrix.target }}
      - name: Install cross linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu=4:13.2.0-7ubuntu1
      - name: Build CLI
        run: cargo build --locked --release -p nivrit-cli --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Rename to asset name
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p out
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/niv.exe" "out/$ASSET"
          else
            cp "target/$TARGET/release/niv" "out/$ASSET"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  # ---- GitHub Release with helper + CLI binaries attached --------------------
  # ---- Reproducible web build, so a deployment can be independently checked --
  build-web:
    name: Web (reproducible)
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2
        with:
          tool: wasm-pack@0.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      # Emits crates/nivrit-web/dist plus a SHA256SUMS manifest. Source paths are
      # remapped so the output does not depend on the builder's home directory,
      # which is what makes the published checksums verifiable by anyone else.
      - name: Build
        run: ./scripts/build-web-reproducible.sh
      # Building twice and comparing proves the claim rather than assuming it. If
      # a dependency ever introduces a timestamp or a random seed, this fails at
      # release time instead of silently publishing a checksum nobody can match.
      - name: Prove the build is reproducible
        run: |
          cp crates/nivrit-web/dist/SHA256SUMS /tmp/expected-SHA256SUMS
          ./scripts/build-web-reproducible.sh --verify /tmp/expected-SHA256SUMS
      - name: Package
        run: |
          mkdir -p release
          tar -czf release/nivrit-web-dist.tar.gz -C crates/nivrit-web/dist .
          cp crates/nivrit-web/dist/SHA256SUMS release/nivrit-web-SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nivrit-web
          path: release/*

  github-release:
    name: GitHub Release
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-24.04' }}
    needs: [build-helper, build-cli, build-web]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Collect binaries
        run: |
          mkdir -p release
          # each artifact is a dir; copy the single file inside, keep the artifact name
          for d in artifacts/niv-* artifacts/nivrit-crypto-helper-*; do
            cp "$(find "$d" -type f | head -1)" "release/$(basename "$d")"
          done
          # The web bundle ships with its checksums so anyone can rebuild this
          # tag and confirm a deployment is serving the code in this repository.
          cp artifacts/nivrit-web/* release/ 2>/dev/null || true
          ls -la release
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: release/*
          generate_release_notes: true

  # ---- Publish the registry SDKs (helper bundled per ecosystem) --------------
  publish-sdks:
    name: Publish ${{ matrix.sdk }}
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    needs: build-helper
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, ruby, java, dotnet, elixir]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Flatten helper binaries
        run: |
          mkdir -p helpers
          for d in artifacts/nivrit-crypto-helper-*; do
            cp "$(find "$d" -type f | head -1)" "helpers/$(basename "$d")"
          done

      # Node -> npm registry: publish the 5 platform helper packages, then the SDK
      - name: Setup Bun
        if: matrix.sdk == 'node'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Setup Node
        if: matrix.sdk == 'node'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.18.0'
      - name: Publish Node
        if: matrix.sdk == 'node'
        working-directory: sdks/node
        run: |
          cp -r ../../helpers .
          bash scripts/build-platform-packages.sh
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          for d in npm/helper-*; do (cd "$d" && bun publish --access public); done
          bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Python -> PyPI: 5 platform wheels via trusted publishing (OIDC)
      - name: Setup Python
        if: matrix.sdk == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'
      - name: Build Python wheels
        if: matrix.sdk == 'python'
        working-directory: sdks/python
        run: |
          cp -r ../../helpers .
          python -m pip install pip==26.1.2 build==1.5.0 wheel==0.47.0 setuptools==83.0.0
          PYTHON=python bash build-wheels.sh
      - name: Publish Python
        if: matrix.sdk == 'python'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: sdks/python/dist

      # Ruby -> RubyGems: 5 fat platform gems
      - name: Setup Ruby
        if: matrix.sdk == 'ruby'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '4.0.6'
      - name: Publish Ruby
        if: matrix.sdk == 'ruby'
        working-directory: sdks/ruby
        run: |
          cp -r ../../helpers .
          bash build-gems.sh
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "$GEM_HOST_API_KEY" > ~/.gem/credentials
          chmod 600 ~/.gem/credentials
          for g in pkg/*.gem; do gem push "$g"; done
        env:
          GEM_HOST_API_KEY: ${{ secrets.GEM_HOST_API_KEY }}

      # Java -> Maven Central: single JAR, all platforms bundled as resources
      - name: Setup Java
        if: matrix.sdk == 'java'
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: oracle
          java-version: '25.0.4'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish Java
        if: matrix.sdk == 'java'
        working-directory: sdks/java
        run: |
          cp -r ../../helpers .
          bash build-resources.sh
          ./mvnw -q -B -DskipTests deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      # .NET -> NuGet: single package, all platforms embedded as resources
      - name: Setup .NET
        if: matrix.sdk == 'dotnet'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.302'
      - name: Publish .NET
        if: matrix.sdk == 'dotnet'
        working-directory: sdks/dotnet/Nivrit
        run: |
          cp -r ../../../helpers .
          bash build-resources.sh
          dotnet restore --locked-mode
          dotnet pack -c Release --no-restore -o out
          dotnet nuget push out/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      # Elixir -> Hex: binaries shipped in priv/
      - name: Setup Elixir
        if: matrix.sdk == 'elixir'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '29.0.3'
          elixir-version: '1.20.2'
      - name: Publish Elixir
        if: matrix.sdk == 'elixir'
        working-directory: sdks/elixir
        run: |
          cp -r ../../helpers .
          bash build-priv.sh
          mix local.hex "$HEX_VERSION" --force
          mix local.rebar rebar3 "$REBAR3_URL" --sha512 "$REBAR3_SHA512" --force
          mix deps.get --check-locked
          mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  # ---- Rust SDK -> crates.io -------------------------------------------------
  # Published in dependency order, because crates.io resolves each crate's deps
  # from the registry rather than from this tree. Every other workspace crate is
  # `publish = false`: the API and CLI ship as binaries and images instead.
  publish-rust:
    name: Publish Rust (crates.io)
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
      - name: Publish crates in dependency order
        run: |
          cargo publish --locked -p nivrit-core
          cargo publish --locked -p nivrit-crypto
          cargo publish --locked -p nivrit-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---- Container images -> GHCR ----------------------------------------------
  docker:
    name: Image (${{ matrix.image }})
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: nivrit-api, dockerfile: Dockerfile.api }
          - { image: nivrit-web, dockerfile: Dockerfile.web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
