name: Bug report
description: Report a problem or unexpected behavior
title: '[bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that triggers the issue.
      placeholder: |
        1. Start the API with ...
        2. Run ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, Bun/Node version, browser, etc.
      placeholder: |
        - OS: Ubuntu 24.04
        - Rust: 1.94
        - Bun: 1.3.14
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant log output, stack traces, or screenshots.
      render: text
    validations:
      required: false
