server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. For an end-to-end-encrypted app the CSP is the primary
    # defense: without it an XSS can read the in-memory private/project keys and
    # exfiltrate every decrypted secret, defeating client-side encryption.
    #   - 'wasm-unsafe-eval' is required to instantiate the crypto WASM module.
    #   - style-src 'unsafe-inline' covers Tailwind/React inline styles.
    #   - img-src data: covers the TOTP QR code.
    #   - connect-src 'self': the API is served same-origin via the /api proxy
    #     below, so build the frontend with VITE_API_URL=/api.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client-side routing: serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Nivrit API service.
    location /api/ {
        proxy_pass http://api:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
